[project]
name = "telehubbi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thallys Torres", email = "thallys.auugusto.torres@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.156.4",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.5",
]

[project.scripts]
telehubbi = "telehubbi:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
